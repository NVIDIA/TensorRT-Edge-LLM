[build-system]
requires = [
    "scikit-build-core>=0.11,<0.12",
    "tomli>=2.0.1; python_version < '3.11'",
    "wheel>=0.45",
]
build-backend = "scikit_build_core.build"

[project]
name = "tensorrt-edgellm"
dynamic = ["version"]
description = "TensorRT Edge-LLM model build and inference package"
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = [
    "nvidia",
    "tensorrt",
    "deeplearning",
    "inference",
    "edge",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "cuda-python>=12.6,<14",
    "nanobind-backend==1.0.0",
    "numpy>=2.2.6,<3",
    "prompt-toolkit>=3.0.43,<4",
]

[project.urls]
Documentation = "https://nvidia.github.io/TensorRT-Edge-LLM/"
Issues = "https://github.com/NVIDIA/TensorRT-Edge-LLM/issues"
Repository = "https://github.com/NVIDIA/TensorRT-Edge-LLM"

[project.optional-dependencies]
quantize = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "huggingface-hub==1.15.0",
    "safetensors==0.8.0",
    "nvidia-modelopt==0.45.0",
    "datasets==5.0.0",
    "tqdm==4.69.0",
    "einops==0.8.2",
    "torchvision==0.29.0",
    "pillow==12.2.0",
    "soundfile==0.14.0",
    "librosa==0.11.0",
]
onnx = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "huggingface-hub==1.15.0",
    "onnx==1.19.0",
    "onnxscript==0.7.1",
    "safetensors==0.8.0",
    "onnx-graphsurgeon==0.6.1",
    "peft==0.19.1",
    "datasets==5.0.0",
    "tqdm==4.69.0",
]
builder = [
    "transformers==5.17.0",
    "nanobind==3.1.0",
]
vocab = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "safetensors==0.8.0",
    "datasets==5.0.0",
]
runtime = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "transformers==5.17.0",
    "huggingface-hub==1.15.0",
    "av==17.1.0",
    "python-multipart==0.0.32",
    "httpx>=0.27.0,<1",
]

[project.scripts]
trtedge = "tensorrt_edgellm.cli:main"
tensorrt-edgellm-quantize = "tensorrt_edgellm.scripts.quantize:main"
tensorrt-edgellm-export = "tensorrt_edgellm.onnx.cli:main"
tensorrt-edgellm-build = "tensorrt_edgellm.builder.cli:main"
tensorrt-edgellm-insert-lora = "tensorrt_edgellm.scripts.insert_lora:main"
tensorrt-edgellm-process-lora = "tensorrt_edgellm.scripts.process_lora_weights:main"
tensorrt-edgellm-merge-lora = "tensorrt_edgellm.scripts.merge_lora:main"
tensorrt-edgellm-reduce-vocab = "tensorrt_edgellm.scripts.reduce_vocab:main"
tensorrt-edgellm-serve = "tensorrt_edgellm.server.cli:main"

[tool.isort]
known_third_party = ["onnx", "onnx_graphsurgeon", "onnxscript"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.20,<4"
ninja.version = ">=1.5,<2"
wheel.py-api = "cp310"
wheel.packages = ["tensorrt_edgellm", "experimental"]
wheel.license-files = ["LICENSE", "3rdParty/nlohmannJson/LICENSE.MIT"]
wheel.exclude = [
    "**/skills/internal/**",
    "**/.gitlab/**",
    "**/.greptile/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "experimental/docker/**",
    "python/nanobind/**",
]
cmake.args = ["-DEDGELLM_PYTHON_ONLY_WHEEL=ON"]
sdist.include = ["/packaging/**", "/CMakeLists.txt", "/LICENSE"]
sdist.exclude = [
    ".claude/**",
    ".greptile/**",
    ".venv*/**",
    "AGENTS.local.md",
    "CODEOWNERS",
    "TODO.md",
    "TODOS.md",
    "artifacts/**",
    "build/**",
    "codex-logs/**",
    "design/**",
    "docs/source/user_guide/examples/omni_internal.md",
    "oss_release_manifest.json",
    "scripts/README.md",
    "scripts/check_oss_release_sanitizer.py",
    "scripts/strip_internal_release.py",
    "sonar-project.properties",
    "venv/**",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "tensorrt_edgellm/_version.py"
