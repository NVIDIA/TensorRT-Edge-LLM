[build-system]
requires = [
    "scikit-build-core>=0.11,<0.12",
    "tomli>=2.0.1; python_version < '3.11'",
    "wheel>=0.45",
]
build-backend = "scikit_build_core.build"

[project]
name = "tensorrt-edgellm"
dynamic = ["version"]
description = "TensorRT Edge-LLM model build and inference package"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "3rdParty/nlohmannJson/LICENSE.MIT"]
keywords = [
    "nvidia",
    "tensorrt",
    "deeplearning",
    "inference",
    "edge",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "cuda-python>=12.6,<14",
    "numpy>=2.2.6,<3",
]

[project.optional-dependencies]
# Compatibility alias; the installed builder is part of the base package.
builder = []
export = [
    "torch==2.13.0",
    "transformers==5.14.1",
    "onnx==1.19.0",
    "onnxscript==0.7.1",
    "safetensors==0.8.0",
    "numpy==2.2.6",
    "onnx-graphsurgeon==0.6.1",
]
tools = [
    "torch==2.13.0",
    "transformers==5.14.1",
    "onnx==1.19.0",
    "onnxscript==0.7.1",
    "safetensors==0.8.0",
    "numpy==2.2.6",
    "onnx-graphsurgeon==0.6.1",
    "nvidia-modelopt==0.45.0",
    "datasets==5.0.0",
    "tqdm==4.69.0",
    "einops==0.8.2",
    "peft==0.19.1",
    "soundfile==0.14.0",
    "librosa==0.11.0",
    "tiktoken==0.13.0",
    "torchvision==0.28.0",
    "backoff",
]
server = [
    "cuda-python>=12.6,<14",
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "huggingface-hub>=1.5.0,<2.0",
    "av==17.1.0",
    "numpy==2.2.6",
    "python-multipart==0.0.32",
]
server-tools = [
    "transformers==5.14.1",
    "jinja2==3.1.6",
]
native-build = [
    "pybind11==3.0.4",
]
dev = []

[project.scripts]
tensorrt-edgellm-quantize = "tensorrt_edgellm.scripts.quantize:main"
tensorrt-edgellm-export = "tensorrt_edgellm.scripts.export:main"
tensorrt-edgellm-build = "experimental.builder.cli:main"
tensorrt-edgellm-insert-lora = "tensorrt_edgellm.scripts.insert_lora:main"
tensorrt-edgellm-process-lora = "tensorrt_edgellm.scripts.process_lora_weights:main"
tensorrt-edgellm-merge-lora = "tensorrt_edgellm.scripts.merge_lora:main"
tensorrt-edgellm-reduce-vocab = "tensorrt_edgellm.scripts.reduce_vocab:main"
tensorrt-edgellm-serve = "experimental.server.cli:main"

[tool.isort]
known_third_party = ["onnx", "onnx_graphsurgeon", "onnxscript"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.20,<4"
ninja.version = ">=1.5,<2"
wheel.packages = ["tensorrt_edgellm", "experimental"]
wheel.exclude = [
    "**/.greptile/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "experimental/docker/**",
    "experimental/pybind/**",
    "experimental/server/setup_pybind.py",
]
cmake.args = ["-DEDGELLM_PYTHON_ONLY_WHEEL=ON"]
sdist.include = ["/packaging/**", "/CMakeLists.txt", "/LICENSE"]
sdist.exclude = [
    ".gitlab/**",
    ".gitlab-ci.yml",
    ".claude/**",
    ".greptile/**",
    ".venv*/**",
    "AGENTS.local.md",
    "CODEOWNERS",
    "DO_NOT_RELEASE",
    "TODO.md",
    "TODOS.md",
    "artifacts/**",
    "build/**",
    "codex-logs/**",
    "design/**",
    "docs/source/user_guide/examples/omni_internal.md",
    "oss_release_manifest.json",
    "scripts/README.md",
    "scripts/check_oss_release_sanitizer.py",
    "scripts/strip_internal_release.py",
    "sonar-project.properties",
    "venv/**",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "tensorrt_edgellm/_version.py"
