schema_version: 1
model_id: Qwen/Qwen3-1.7B
inputs: [text]
outputs: [text]
cases:
  - name: nvfp4-eagle3-onnx
    mode: onnx
    platform: l0_e2e_drive_thor
    quantized_model_id_or_dir: /scratch.edge_llm_data/onnx_models/modelopt-0.45.0/quantization_checkpoint/public/Qwen3-1.7B-NVFP4
    requirements:
      min_sm: 100
      min_gpu_memory_gb: 6
    spec_decode_config: eagle3
    draft_id_or_dir: /scratch.edge_llm_data/onnx_models/modelopt-0.45.0/quantization_checkpoint/public/Qwen3-1.7B_eagle3-NVFP4
    draft_model_name: eagle3
    engine:
      max_kv_cache_capacity: 2048
      max_input_len: 1024
      max_batch_size: 1
      max_spec_verify_tokens: 8
      max_spec_draft_tokens: 60
    inference:
      - name: basic
        scenario: generate
        input_file: tests/test_cases/llm_basic.json
        checks:
          accuracy:
            required: [rouge1, rouge_l]
            max_regression: 0.30
          performance:
            required:
              - prefill_tokens_per_second
              - spec_decode_acceptance_rate
              - spec_decode_average_accept_length
              - spec_decode_tokens_per_second
            max_regression: 0.30

  - name: nvfp4-eagle3-direct
    mode: direct_builder
    platform: l0_e2e_b100
    quantized_model_id_or_dir: /scratch.edge_llm_data/onnx_models/modelopt-0.45.0/quantization_checkpoint/public/Qwen3-1.7B-NVFP4
    requirements:
      min_sm: 100
      min_gpu_memory_gb: 6
    spec_decode_config: eagle3
    draft_id_or_dir: /scratch.edge_llm_data/onnx_models/modelopt-0.45.0/quantization_checkpoint/public/Qwen3-1.7B_eagle3-NVFP4
    draft_model_name: eagle3
    engine:
      max_kv_cache_capacity: 2048
      max_input_len: 1024
      max_batch_size: 1
      # The runtime verifies 8 tokens; the 16 rows above are jump-forward headroom.
      max_spec_verify_tokens: 24
      spec_verify_tokens: 8
      max_spec_draft_tokens: 60
    inference:
      - name: guided-decoding-jump-forward
        scenario: generate
        input_file: tests/test_cases/llm_guided_decoding_jump_forward.json
