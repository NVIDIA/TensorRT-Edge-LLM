schema_version: 1
model_id: google/gemma-4-E2B-it
inputs: [text]
outputs: [text]
cases:
  - name: nvfp4-mtp-onnx
    model_name: gemma-4-E2B-it-NVFP4
    mode: onnx
    platform: l0_e2e_drive_thor
    quantized_model_id_or_dir: /scratch.edge_llm_cache/models/modelopt-0.45.0/quantization_checkpoint/public/gemma-4-E2B-it-NVFP4
    requirements:
      min_sm: 100
      min_gpu_memory_gb: 11
    spec_decode_config: mtp
    draft_id_or_dir: ${LLM_MODELS_DIR}/gemma/gemma-4-E2B-it-assistant
    engine:
      max_kv_cache_capacity: 2048
      max_input_len: 1024
      max_batch_size: 1
    inference:
      - name: basic
        scenario: generate
        input_file: tests/test_cases/llm_basic.json
        checks:
          accuracy:
            required: [rouge1, rouge_l]
            max_regression: 0.30
          performance:
            required:
              - peak_gpu_memory_mb
              - prefill_tokens_per_second
              - spec_decode_acceptance_rate
              - spec_decode_average_accept_length
              - spec_decode_tokens_per_second
            max_regression: 0.30
      - name: guided-decoding
        scenario: generate
        input_file: tests/test_cases/llm_guided_decoding.json
        checks:
          performance:
            required:
              - peak_gpu_memory_mb
              - prefill_tokens_per_second
              - spec_decode_acceptance_rate
              - spec_decode_average_accept_length
              - spec_decode_tokens_per_second
            max_regression: 0.30
