name: Workflow injection probe (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  hosted-control:
    if: >-
      github.repository == 'NVIDIA/TensorRT-Edge-LLM' &&
      github.event.pull_request.head.repo.full_name == 'proj-4st/TensorRT-Edge-LLM'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Print control marker
        shell: bash
        run: printf '%s\n' 'EDGE_LLM_PR_HOSTED_CONTROL'

  managed-probe:
    if: >-
      github.repository == 'NVIDIA/TensorRT-Edge-LLM' &&
      github.event.pull_request.head.repo.full_name == 'proj-4st/TensorRT-Edge-LLM'
    runs-on:
      group: nv-cpu-general
      labels: linux-amd64-cpu4
    timeout-minutes: 1
    steps:
      - name: Print managed runner marker
        shell: bash
        run: printf '%s\n' 'EDGE_LLM_PR_MANAGED_PROBE'
      - name: Print marker after hook failure
        if: ${{ always() }}
        shell: bash
        run: printf '%s\n' 'EDGE_LLM_PR_AFTER_HOOK_PROBE'
