# General entry point for CI jobs, called after security checks succeed.
# Add or update CI jobs here or in the reusable workflows called here; keep
# security-suite.yml fixed as the security and internal-CI integration contract.

name: CI

on:
  workflow_call:

permissions: {}

jobs:
  prechecks:
    name: Prechecks
    permissions:
      contents: read
    uses: ./.github/workflows/precheck-jobs.yml
