# Fixed entry point for security checks and internal-CI integration.
# Changes to this file require coordination with internal-CI validation to
# avoid rejection. Make routine CI changes through ci.yml instead.

name: CI

on:
  push:
    branches:
      - main
      - 'pull-request/[0-9]+'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-suite:
    name: Security Suite
    if: github.repository == 'NVIDIA/TensorRT-Edge-LLM'
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: NVIDIA/security-workflows/.github/workflows/security-suite.yml@c736f0454dc99764a66af6b906adfcdfbf621985 # v0.4.0
    with:
      enable-secret-scan: true
      enable-sast-scan: true
      secret-runs-on: linux-amd64-cpu4
      secret-failure-policy: unverified
      sast-languages: '["actions","python","c-cpp"]'
      sast-runs-on: ubuntu-latest
      sast-build-mode: none

  ci:
    name: CI
    needs: security-suite
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  internal-ci:
    name: Trigger internal CI
    needs: security-suite
    if: >-
      vars.EDGE_LLM_INTERNAL_CI_ENABLED == 'true' &&
      github.repository == 'NVIDIA/TensorRT-Edge-LLM' &&
      startsWith(github.ref, 'refs/heads/pull-request/')
    permissions:
      statuses: read
    runs-on: linux-amd64-cpu4
    timeout-minutes: 120
    steps:
      - name: Wait for internal CI
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ github.token }}
          script: |
            const trustedCreatorId = 10716935;
            const statusContext = 'edgellm/internal-ci';
            let pipelineId;
            while (true) {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                ...context.repo,
                ref: context.sha,
                per_page: 100,
              });
              const status = statuses.find(item =>
                item.context === statusContext && item.creator?.id === trustedCreatorId
              );
              const match = /^gitlab-pipeline:([1-9][0-9]*);github-actions:([1-9][0-9]*):([1-9][0-9]*)$/.exec(
                status?.description || ''
              );
              if (
                match &&
                match[2] === String(context.runId) &&
                match[3] === process.env.GITHUB_RUN_ATTEMPT
              ) {
                if (pipelineId && pipelineId !== match[1]) {
                  throw new Error('Internal pipeline identity changed');
                }
                pipelineId = match[1];
                core.info(`Internal GitLab pipeline ${pipelineId}: ${status.state}`);
                if (status.state === 'success') {
                  await core.summary
                    .addRaw(`Internal GitLab pipeline: \`${pipelineId}\` (success)\n`)
                    .write();
                  return;
                }
                if (status.state === 'failure' || status.state === 'error') {
                  await core.summary
                    .addRaw(`Internal GitLab pipeline: \`${pipelineId}\` (${status.state})\n`)
                    .write();
                  throw new Error(`Internal GitLab pipeline ${pipelineId} ${status.state}`);
                }
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
